name: sharedpreferences
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  google_mobile_ads: ^5.1.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icoon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icoon.png"

flutter_native_splash:
  color: "#0056c6"
  image: assets/icoon.png
  android_12:
    image: assets/icoon.png
    color: "#0056c6"
  fullscreen: true